name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Codex ships frequently and its plugin loader is still changing. A weekly run
  # surfaces a manifest that a newer release started rejecting, rather than
  # letting customers hit it at install time.
  schedule:
    - cron: '0 14 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Codex
        # Unpinned on purpose: the point of the weekly run is to test the
        # release customers are installing now.
        run: npm install --global @openai/codex

      - name: Install the plugin into a throwaway Codex home
        run: tests/codex-install-test.sh

      - name: Shell lint
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Snapshot install tests
        run: tests/apply-snapshot-test.sh

      - name: Plugin contract tests
        run: tests/plugin-contract-test.sh
